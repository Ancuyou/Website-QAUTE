<section th:fragment="consultant-profile" id="profile-management" class="py-5">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold"><i class="fas fa-user-edit text-primary me-2"></i>Hồ sơ tư vấn viên</h2>
                <p class="text-muted">Quản lý thông tin cá nhân và chuyên môn của bạn.</p>
            </div>
        </div>

        <!-- <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="fas fa-check-circle me-2"></i> <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fas fa-exclamation-triangle me-2"></i> <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div> -->

        <form th:action="@{/consultant/profile/update}" method="post" enctype="multipart/form-data" novalidate>
            <input type="hidden" id="resetAvatarFlag" name="resetAvatar" value="false">
            
            <div class="row g-4">
                
                <div class="col-lg-4">
                    <div class="card border-0 shadow-sm sticky-top" style="top: 100px;">
                        <div class="card-body text-center p-4">
                            <div class="position-relative d-inline-block mb-3">
                                <img id="avatarPreview"
                                     th:src="${profile.avatar != null and !#strings.isEmpty(profile.avatar) ? profile.avatar : '/qaute/images/default_avatar.png'}"
                                     class="rounded-circle img-thumbnail p-1"
                                     alt="Avatar"
                                     width="150"
                                     height="150"
                                     style="object-fit: cover;"> <label for="avatarUpload"
                                       class="btn btn-sm btn-primary position-absolute bottom-0 end-0 rounded-circle shadow"
                                       style="width: 35px; height: 35px; line-height: 22px; padding: 0; cursor: pointer;"
                                       title="Thay đổi ảnh đại diện">
                                    <i class="fas fa-camera"></i>
                                </label>
                                <button class="btn btn-sm btn-danger position-absolute bottom-0 start-0 rounded-circle shadow"
                                        style="width: 35px; height: 35px;"
                                        onclick="resetConsultantAvatar(event)"
                                        type="button"
                                        title="Xóa ảnh đại diện"
                                        th:if="${profile.avatar != null and profile.avatar != '/qaute/images/default_avatar.png'}">
                                    <i class="fas fa-times"></i>
                                </button>
                                <input type="file"
                                       id="avatarUpload"
                                       name="avatarFile"
                                       accept="image/*"
                                       class="d-none"
                                       onchange="previewAvatar(this)">
                            </div>
                            
                            <h4 class="fw-bold mb-1" th:text="${profile.fullName != null ? profile.fullName : 'Chưa cập nhật'}">Nguyễn Văn Tư Vấn</h4>
                            <p class="text-primary fw-semibold mb-3">Tư vấn viên</p>
                            
                            <div class="d-grid gap-2">
                                <a th:href="@{/consultant/public/{id}(id=${consultant.consultantID})}" class="btn btn-sm btn-outline-primary" target="_blank">
                                    <i class="fas fa-eye me-2"></i> Xem hồ sơ công khai
                                </a>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-8">
                    <div class="card border-0 shadow-sm mb-4">
                        <div class="card-header bg-white border-0 pt-3 pb-0">
                            <h5 class="card-title mb-0 fw-bold"><i class="fas fa-user-circle me-2 text-primary"></i>Thông tin cá nhân</h5>
                        </div>
                        <div class="card-body p-4">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label">Họ và tên <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fas fa-user fa-fw"></i></span>
                                        <input type="text" class="form-control" name="fullName" th:value="${profile.fullName}" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Email</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fas fa-envelope fa-fw"></i></span>
                                        <input type="email" class="form-control" th:value="${account.email}" disabled readonly>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Số điện thoại <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fas fa-phone fa-fw"></i></span>
                                        <input type="tel" class="form-control" name="phone" th:value="${profile.phone}" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Tên đăng nhập</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fas fa-user-lock fa-fw"></i></span>
                                        <input type="text" class="form-control" th:value="${account.username}" disabled readonly>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="card border-0 shadow-sm mb-4" th:if="${consultant != null}">
                        <div class="card-header bg-white border-0 pt-3 pb-0">
                            <h5 class="card-title mb-0 fw-bold"><i class="fas fa-briefcase me-2 text-primary"></i>Thông tin chuyên môn</h5>
                        </div>
                        <div class="card-body p-4">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label">Consultant ID</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fas fa-id-card fa-fw"></i></span>
                                        <input type="text" class="form-control" th:value="${consultant.consultantID}" disabled readonly>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Năm kinh nghiệm <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fas fa-star fa-fw"></i></span>
                                        <input type="number" class="form-control" name="experienceYears" th:value="${consultant.experienceYears}" min="0" required>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="card border-0 shadow-sm mb-4" th:if="${consultant == null}">
                        <div class="card-body text-center py-5">
                            <i class="fas fa-user-tie fa-3x text-muted mb-3"></i>
                            <h5 class="text-muted">Chưa có thông tin tư vấn viên</h5>
                            <p class="text-muted">Vui lòng liên hệ quản trị viên để thiết lập hồ sơ tư vấn viên</p>
                        </div>
                    </div>

                    <div classs="mt-4">
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-save me-2"></i> Lưu thay đổi
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <script>
        const DEFAULT_CONSULTANT_AVATAR = /*[[@{/qaute/images/default_avatar.png}]]*/ '/qaute/images/default_avatar.png';
        
        function previewAvatar(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('avatarPreview');
                    if (preview) {
                        preview.src = e.target.result;
                    }
                    // Gắn cờ báo là không reset
                    const resetFlag = document.getElementById('resetAvatarFlag');
                    if (resetFlag) resetFlag.value = 'false'; 
                };
                reader.readAsDataURL(input.files[0]);
            }
        }
        
        function resetConsultantAvatar(event) {
            event.preventDefault(); // Ngăn form submit
            
            if (confirm('Bạn có chắc muốn xóa ảnh đại diện và đặt về mặc định?')) {
                const img = document.getElementById('avatarPreview');
                if (img) img.src = DEFAULT_CONSULTANT_AVATAR;

                const fileInput = document.getElementById('avatarUpload');
                if (fileInput) fileInput.value = '';

                // Đặt flag để controller biết cần reset
                const resetFlag = document.getElementById('resetAvatarFlag');
                if (resetFlag) resetFlag.value = 'true';

                // Ẩn nút X
                const btn = event.target.closest('button');
                if (btn) btn.style.display = 'none';
                event.target.closest('form').submit();
            }
        }
    </script>
</section>
