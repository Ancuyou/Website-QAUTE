<!-- templates/fragments/user-dropdown.html -->
<ul th:fragment="userDropdown(userName, avatarUrl)"
    class="navbar-nav ms-auto">
    <li class="nav-item dropdown">
        <a class="nav-link dropdown-toggle d-flex align-items-center"
           href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            <img th:src="${avatarUrl} ?: 'https://via.placeholder.com/32'"
                 src="https://via.placeholder.com/32"
                 class="rounded-circle me-2" alt="Avatar" width="32" height="32">
            <span class="fw-semibold" th:text="${userName} ?: 'Nguyễn Văn A'">Nguyễn Văn A</span>
        </a>
        <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" th:href="@{/home/profile}">
                <i class="fas fa-user me-2"></i>Hồ sơ cá nhân</a></li>
            <li><a class="dropdown-item" th:href="@{/settings}">
                <i class="fas fa-cog me-2"></i>Cài đặt</a></li>
            <li><a class="dropdown-item" th:href="@{/advice/history}">
                <i class="fas fa-history me-2"></i>Lịch sử tư vấn</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item text-danger" th:href="@{/auth/logout}">
                <i class="fas fa-sign-out-alt me-2"></i>Đăng xuất</a></li>
        </ul>
    </li>
</ul>
