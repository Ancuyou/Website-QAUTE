<th:block th:replace="~{pages/admin/layout :: layout(~{::notifications_content}, 'notifications')}">

  <th:block th:fragment="notifications_content">
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
      <h1 class="h2">
        <i class="fas fa-bell me-2"></i>Quản lý thông báo hệ thống
      </h1>
      <a class="btn btn-primary" th:href="@{/admin/notifications/new}">
        <i class="fas fa-plus me-2"></i>Thêm thông báo
      </a>
    </div>
      <!-- Hiển thị thông báo kết quả -->
      <div th:if="${success}" class="alert alert-success alert-dismissible fade show mt-2" role="alert">
          <i class="fas fa-check-circle me-2"></i>
          <span th:text="${success}"></span>
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>

      <div th:if="${error}" class="alert alert-danger alert-dismissible fade show mt-2" role="alert">
          <i class="fas fa-exclamation-circle me-2"></i>
          <span th:text="${error}"></span>
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
      <!-- Form tìm kiếm -->
      <form th:action="@{/admin/notifications}" method="get" class="row g-2 align-items-end">
          <!-- Ô tìm kiếm -->
          <div class="col-12 col-md-6">
              <label class="form-label small fw-semibold">Tìm kiếm</label>
              <input type="text" name="q" class="form-control"
                     th:value="${q}" placeholder="Tìm theo tiêu đề, nội dung, người gửi..."/>
          </div>

          <!-- Trạng thái -->
          <div class="col-6 col-md-3">
              <label class="form-label small fw-semibold">Trạng thái</label>
              <select name="status" class="form-select">
                  <option value="">Tất cả</option>
                  <option value="PUBLISHED" th:selected="${status == 'PUBLISHED'}">Xuất bản</option>
                  <option value="DRAFT"     th:selected="${status == 'DRAFT'}">Nháp</option>
              </select>
          </div>

          <!-- Nút tìm -->
          <div class="col-6 col-md-3 d-grid">
              <label class="form-label d-none d-md-block">&nbsp;</label>
              <button type="submit" class="btn btn-primary">
                  <i class="fas fa-search me-2"></i>Tìm kiếm
              </button>
          </div>
      </form>


      <!-- Bảng danh sách thông báo -->
    <div class="card shadow">
      <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                <tr>
                    <th scope="col" style="width: 72px;">ID</th>
                    <th scope="col" style="min-width: 220px;">Người gửi</th>
                    <th scope="col" style="width: 120px;">Đối tượng</th>
                    <th scope="col" style="min-width: 360px;">Nội dung</th>
                    <th scope="col" style="width: 170px;">Ngày tạo</th>
                    <th scope="col" style="width: 130px;">Trạng thái</th>
                    <th scope="col" class="text-nowrap" style="width: 120px;">Thao tác</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="n : ${notifications}">
                    <!-- ID -->
                    <td class="text-muted" th:text="${n.notificationID}">1</td>

                    <!-- Người gửi: avatar + tên (ưu tiên fullName nếu có) -->
                    <td>
                        <div class="d-flex align-items-center">
                            <img th:src="@{${n.sender?.profile?.avatar} ?: '/images/default_avatar.png'}"
                                 class="rounded-circle me-2" width="36" height="36" alt="Avatar"/>
                            <div class="d-flex flex-column">
                                <span class="fw-semibold"
                                      th:text="${n.sender?.profile?.fullName != null && !#strings.isEmpty(n.sender.profile.fullName) ? n.sender.profile.fullName : n.sender?.username}">
                                  Admin
                                </span>
                                <small class="text-muted" th:text="${n.sender?.email}">admin@example.com</small>
                            </div>
                        </div>
                    </td>

                    <!-- Đối tượng: hiển thị dạng badge -->
                    <td>
                        <span class="badge bg-info text-dark" th:text="${n.targetType}">USER</span>
                    </td>

                    <!-- Nội dung: Tiêu đề đậm + trích dẫn nội dung ngắn -->
                    <td>
                        <div class="fw-semibold text-truncate" style="max-width: 480px;"
                             th:text="${n.title}">Thông báo cập nhật hệ thống</div>
                        <div class="text-muted small text-truncate" style="max-width: 480px;"
                             th:text="${#strings.abbreviate(n.content, 100)}">
                            Mô tả ngắn nội dung thông báo…
                        </div>
                    </td>

                    <!-- Ngày tạo -->
                    <td>
                        <span th:text="${n.createdDate != null ? #dates.format(n.createdDate, 'dd/MM/yyyy HH:mm') : 'N/A'}">
                          14/10/2025 09:30
                        </span>
                    </td>

                    <!-- Trạng thái: badge đẹp, nhất quán -->
                    <td>
                        <span class="badge rounded-pill"
                              th:classappend="${
                                  n.status == 'PUBLISHED' ? ' bg-success' :
                                  (n.status == 'DRAFT' ? ' bg-secondary' : ' bg-warning')
                              }"
                              th:text="${
                                  n.status == 'PUBLISHED' ? 'Xuất bản' :
                                  (n.status == 'DRAFT' ? 'Nháp' : n.status)
                              }">
                          Nháp
                        </span>
                    </td>

                    <!-- Thao tác -->
                    <td class="text-nowrap">
                        <a class="btn btn-sm btn-warning"
                           th:href="@{/admin/notifications/edit/{id}(id=${n.notificationID})}"
                           title="Sửa">
                            <i class="fas fa-edit"></i>
                        </a>
                        <form th:action="@{/admin/notifications/delete/{id}(id=${n.notificationID})}"
                              method="post" class="d-inline"
                              onsubmit="return confirm('Bạn có chắc chắn muốn xóa thông báo này?');">
                            <button type="submit" class="btn btn-sm btn-danger" title="Xóa">
                                <i class="fas fa-trash"></i>
                            </button>
                        </form>
                    </td>
                </tr>

                <!-- Empty state -->
                <tr th:if="${#lists.isEmpty(notifications)}">
                    <td colspan="7" class="text-center text-muted py-4">
                        Không có thông báo nào.
                    </td>
                </tr>
                </tbody>
            </table>

        </div>

        <!-- Phân trang -->
        <nav th:if="${totalPages > 1}">
          <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
              <a class="page-link"
                 th:href="@{/admin/notifications(page=${currentPage - 1}, size=${size}, q=${q})}">
                Trước
              </a>
            </li>
            <li class="page-item"
                th:each="i : ${#numbers.sequence(1, totalPages)}"
                th:classappend="${i == currentPage} ? 'active'">
              <a class="page-link"
                 th:text="${i}"
                 th:href="@{/admin/notifications(page=${i}, size=${size}, q=${q})}">
                1
              </a>
            </li>
            <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
              <a class="page-link"
                 th:href="@{/admin/notifications(page=${currentPage + 1}, size=${size}, q=${q})}">
                Sau
              </a>
            </li>
          </ul>

          <div class="d-flex justify-content-between align-items-center mt-3">
            <p class="text-muted mb-0">
              Hiển thị <span th:text="${#lists.size(notifications)}"></span> /
              <span th:text="${totalItems}"></span> thông báo
            </p>
            <div class="d-flex align-items-center">
              <label class="me-2 mb-0">Số dòng:</label>
              <form th:action="@{/admin/notifications}" method="get" class="d-inline">
                <input type="hidden" name="page" value="1"/>
                <input type="hidden" name="q" th:value="${q}"/>
                <select name="size" class="form-select form-select-sm" style="width:auto;" onchange="this.form.submit()">
                  <option th:each="opt : ${pageSizeOptions}"
                          th:value="${opt}"
                          th:text="${opt}"
                          th:selected="${opt == size}">5</option>
                </select>
              </form>
            </div>
          </div>
        </nav>
      </div>
    </div>
  </th:block>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const alerts = document.querySelectorAll('.alert');
            alerts.forEach(alert => {
                setTimeout(() => {
                    alert.classList.remove('show');  // làm fade-out mượt
                    alert.classList.add('fade');
                    setTimeout(() => {
                        const bsAlert = bootstrap.Alert.getOrCreateInstance(alert);
                        bsAlert.close(); // đóng hoàn toàn
                    }, 500); // chờ hiệu ứng fade-out 0.5s
                }, 3000); // tự ẩn sau 3 giây
            });
        });
    </script>
</th:block>
